<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pants Pattern Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f9f9f9;
    }
    canvas {
      border: 1px solid #333;
      background: #fff;
      margin-top: 16px;
    }
    label, input {
      font-size: 16px;
      margin: 1px;
    }
    .legend {
      margin-top: 16px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <h2>Pants Pattern Generator</h2>
  <p><label for="length">Length (inches):</label>
  <input type="number" id="length" value="40" min="10" max="60"><br>
  <label for="leg">actual leg (inches):</label>
  <input type="number" id="leg" value="25" min="10" max="60"><br>
  <button onclick="drawPattern()">Draw Pattern</button></p>
  
  <canvas id="patternCanvas" width="430" height="700"></canvas>

  <div class="legend">
    <p>• Dotted line at top = Waistline<br>
       • Dotted lines near bottom = 2" & 4" above hem<br>
       • Solid line at very bottom = Hemline (base)</p>
  </div>

  <script>
    const canvas = document.getElementById('patternCanvas');
    const ctx = canvas.getContext('2d');
    const scale = 16; // 16 pixels = 1 inch

    function drawPattern() {
      const length = parseFloat(document.getElementById('length').value);
      const leg = parseFloat(document.getElementById('leg').value);
      const totalHeight = length * scale;
      const center = ((leg / 4) + 2.5) * scale;
      const bottomY = canvas.height - 20; // offset from bottom edge
      const waistY = bottomY - totalHeight + scale; // adjusted for -1"
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // center line
      
      ctx.beginPath();
      ctx.moveTo(center, waistY);
      ctx.lineTo(center, bottomY);
      ctx.strokeStyle = "#000";
      ctx.setLineDash([]); // solid
      ctx.stroke();
      ctx.closePath();
      
      // bottom (hemline)
      
      ctx.beginPath();
      ctx.moveTo(50, bottomY);
      ctx.lineTo(300, bottomY);
      ctx.strokeStyle = "#000";
      ctx.setLineDash([]); // solid
      ctx.stroke();
      ctx.closePath();

      // 2" above bottom
      ctx.beginPath();
      ctx.moveTo(50, bottomY - 2 * scale);
      ctx.lineTo(300, bottomY - 2 * scale);
      ctx.strokeStyle = "#999";
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.closePath();

      // 4" above bottom
      ctx.beginPath();
      ctx.moveTo(50, bottomY - 4 * scale);
      ctx.lineTo(300, bottomY - 4 * scale);
      ctx.stroke();
      ctx.closePath();

      // waistline (based on length input)
      
      ctx.beginPath();
      ctx.moveTo(50, waistY);
      ctx.lineTo(350, waistY);
      ctx.strokeStyle = "#f00";
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.closePath();

      // labels
      ctx.setLineDash([]);
      ctx.fillStyle = "#000";
      ctx.font = "14px Arial";
      ctx.fillText("Bottom (Hemline)", 310, bottomY + 5);
      ctx.fillText("2\" above bottom", 310, bottomY - 2 * scale + 5);
      ctx.fillText("4\" above bottom", 310, bottomY - 4 * scale + 5);
      ctx.fillStyle = "#f00";
      ctx.fillText("Waistline", 360, waistY + 5);
    }

    // initial draw
    drawPattern();
  </script>
</body>
</html>
