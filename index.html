<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pants Pattern Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: right;
      background: #f9f9f9;
    }
    canvas {
      border: 1px solid #333;
      background: #fff;
      margin-top: 16px;
    }
    label, input {
      font-size: 16px;
      margin: 1px;
    }
    .legend {
      margin-top: 16px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <h2>Pants Pattern Generator</h2>
  <h3>Measurements (in inches)</h3>
  <p><label for="length">Length:</label>
  <input type="number" id="length" value="40" min="10" max="60"><br>
  <label for="flatHip">Flat Hip:</label>
  <input type="number" id="flatHip" value="37" min="10" max="60"><br>
  <label for="crotch">Crotch:</label>
  <input type="number" id="crotch" value="10" min="7" max="12"><br>
  <label for="leg">Leg:</label>
  <input type="number" id="leg" value="21" min="10" max="60"><br>
  <label for="knee">Knee</label>
  <input type="number" id="knee" value="18" min="10" max="60"><br>
  <label for="bottom">Bottom</label>
  <input type="number" id="bottom" value="16" min="10" max="60"></p>
  <p></p>
  <button onclick="drawPattern()">Draw Pattern</button>
  <button onclick="downloadPattern()">Download PNG</button>
  
  <canvas id="patternCanvas" width="860" height="1400"></canvas>

  <div class="legend">
    <p>• Dotted line at top = Waistline<br>
       • Dotted lines near bottom = 2" & 4" above hem<br>
       • Solid line at very bottom = Hemline (base)</p>
  </div>

  <script>
    const canvas = document.getElementById('patternCanvas');
    const ctx = canvas.getContext('2d');
    const scale = 32; // 16 pixels = 1 inch

    function drawPattern() {
      const length = parseFloat(document.getElementById('length').value);
      const flatHip = parseFloat(document.getElementById('flatHip').value);
      const crotch = parseFloat(document.getElementById('crotch').value);
      const leg = parseFloat(document.getElementById('leg').value);
      const knee = parseFloat(document.getElementById('knee').value);
      const bottom = parseFloat(document.getElementById('bottom').value);
      
      const totalHeight = length * scale;
      const center = ((flatHip / 6) + 4) * scale;
      const bottomY = canvas.height - 20; // offset from bottom edge
      const frontWaistY = (bottomY - totalHeight) + scale; // adjusted for -1"
      const frontCrotchY = frontWaistY + ((crotch - 1) * scale); // offset from bottom edge 
      const backCrotchY = frontCrotchY + (.5 * scale);
      const legY = frontCrotchY + (4 * scale); // offset from bottom edge 
      const kneeY = frontWaistY + (((length / 2) - .75) * scale); // offset from bottom edge 
      
      const refY = (crotch / 4) * scale;

      const frontHipY = frontCrotchY - refY;
      const backHipY = frontHipY - refY;
      const backWaistY = frontWaistY - refY;
      
      const frontBottom = (bottom / 2) * scale;
      const backBottom = frontBottom + (2 * scale);
      const frontKnee = (knee / 2) * scale;
      const backKnee = frontKnee + (2 * scale);
      const frontLeg = (leg / 2) * scale;
      const backLeg = frontLeg + (2 * scale);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // center line
      ctx.beginPath();
      ctx.moveTo(center, frontWaistY - refY);
      ctx.lineTo(center, bottomY);
      ctx.strokeStyle = "#000";
      ctx.setLineDash([]); // solid
      ctx.stroke();
      ctx.closePath();

      // grainline arrow (center)
      ctx.beginPath();
      ctx.moveTo(center, backWaistY + 20); // start point (a bit below waist)
      ctx.lineTo(center, bottomY - 20); // end point (a bit above hem)
      ctx.strokeStyle = "#00f";
      ctx.lineWidth = 2;
      ctx.setLineDash([]); // solid
      ctx.stroke();
      ctx.closePath();

      // arrowheads
      ctx.beginPath();
      // top arrowhead (pointing up)
      ctx.moveTo(center - 6, backWaistY + 25);
      ctx.lineTo(center, backWaistY + 15);
      ctx.lineTo(center + 6, backWaistY + 25);

      // bottom arrowhead (pointing down)
      ctx.moveTo(center - 6, bottomY - 25);
      ctx.lineTo(center, bottomY - 15);
      ctx.lineTo(center + 6, bottomY - 25);

      ctx.fillStyle = "#00f";
      ctx.fill();
      ctx.closePath();

      // grainline label
      ctx.fillStyle = "#00f";
      ctx.font = "14px Arial";
      ctx.fillText("Grainline", center + 10, ((frontWaistY + bottomY) / 2) + scale);
    
      
      // bottom (hemline)
      ctx.beginPath();
      ctx.moveTo(50, bottomY);
      ctx.lineTo(600, bottomY);
      ctx.strokeStyle = "#000";
      ctx.setLineDash([]); // solid
      ctx.stroke();
      ctx.closePath();
      
      // 2" above bottom
      ctx.beginPath();
      ctx.moveTo(50, bottomY - 2 * scale);
      ctx.lineTo(600, bottomY - 2 * scale);
      ctx.strokeStyle = "#999";
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.closePath();

      // 4" above bottom
      ctx.beginPath();
      ctx.moveTo(50, bottomY - 4 * scale);
      ctx.lineTo(600, bottomY - 4 * scale);
      ctx.stroke();
      ctx.closePath();

      // back waistline
      ctx.beginPath();
      ctx.moveTo(50, backWaistY);
      ctx.lineTo(700, backWaistY);
      ctx.strokeStyle = "#f00";
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.closePath();
      
      // front waistline (based on length input)
      ctx.beginPath();
      ctx.moveTo(50, frontWaistY);
      ctx.lineTo(700, frontWaistY);
      ctx.strokeStyle = "#f00";
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.closePath();

      // back hipline
      ctx.beginPath();
      ctx.moveTo(50, backHipY);
      ctx.lineTo(700, backHipY);
      ctx.strokeStyle = "#f00";
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.closePath();

      // front hipline
      ctx.beginPath();
      ctx.moveTo(50, frontHipY);
      ctx.lineTo(700, frontHipY);
      ctx.strokeStyle = "#f00";
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.closePath();
      
      // front crotch line
      ctx.beginPath();
      ctx.moveTo(50, frontCrotchY);
      ctx.lineTo(700, frontCrotchY);
      ctx.strokeStyle = "#f00";
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.closePath();

      // back crotch line
      ctx.beginPath();
      ctx.moveTo(50, backCrotchY);
      ctx.lineTo(700, backCrotchY);
      ctx.strokeStyle = "#f00";
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.closePath();

      // leg line
      ctx.beginPath();
      ctx.moveTo(50, legY);
      ctx.lineTo(700, legY);
      ctx.strokeStyle = "#f00";
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.closePath();

      // knee line
      ctx.beginPath();
      ctx.moveTo(50, kneeY);
      ctx.lineTo(700, kneeY);
      ctx.strokeStyle = "#f00";
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.closePath();

      // labels
      ctx.setLineDash([]);
      ctx.fillStyle = "#000";
      ctx.font = "14px Arial";
      ctx.fillText("Bottom (Hemline)", 660, bottomY + 5);
      ctx.fillText("2\" above bottom", 660, bottomY - 2 * scale + 5);
      ctx.fillText("4\" above bottom", 660, bottomY - 4 * scale + 5);
      ctx.fillStyle = "#f00";
      ctx.fillText("Back Waistline", 710, backWaistY + 5);
      ctx.fillText(" Front Waistline", 710, frontWaistY + 5);
      ctx.fillText("Back Hipline", 710, backHipY + 5);
      ctx.fillText("front Hipline", 710, frontHipY + 5);
      ctx.fillText("Front Crotchline", 710, frontCrotchY + 5);
      ctx.fillText("Back Crotchline", 710, backCrotchY + 5);
      ctx.fillText("Legline", 710, legY + 5);
      ctx.fillText("Kneeline", 710, kneeY + 5);
   
      // bottom line
      ctx.beginPath();
      ctx.moveTo(center - (frontBottom / 2), bottomY - (2 * scale));
      ctx.lineTo(center + (frontBottom / 2), bottomY - (2 * scale));
      ctx.strokeStyle = "#000";
      ctx.setLineDash([]);
      ctx.stroke();
      ctx.closePath();

      //left bottom => knee line
      ctx.beginPath();
      ctx.moveTo(center - (frontBottom / 2), bottomY);
      ctx.lineTo(center - (frontBottom / 2), bottomY - (4 * scale));
      ctx.strokeStyle = "#000";
      ctx.setLineDash([]);
      ctx.stroke();
      ctx.closePath();
    }

    // initial draw
    drawPattern();

    function downloadPattern() {
      const canvas = document.getElementById('patternCanvas');
      const tempCanvas = document.createElement('canvas');
      const ctxTemp = tempCanvas.getContext('2d');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;

      // Fill with white background
      ctxTemp.fillStyle = "#fff";
      ctxTemp.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

      // Draw existing canvas content
      ctxTemp.drawImage(canvas, 0, 0);

      // Save PNG
      const link = document.createElement('a');
      link.download = 'pants-pattern.png';
      link.href = tempCanvas.toDataURL('image/png');
      link.click();
    }
    
    
  </script>
</body>
</html>
